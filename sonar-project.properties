sonar.projectKey=notes-app
sonar.projectName=Notes App
sonar.projectVersion=1.0

# both halves of the monorepo are analysed as one project
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test,frontend/test
# the frontend keeps its tests beside the code they cover
sonar.test.inclusions=backend/test/**/*.ts,frontend/test/**/*.ts,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

sonar.sourceEncoding=UTF-8

# lcov from c8 on the backend and from jest on the frontend
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.config.*,frontend/src/vite-env.d.ts,frontend/src/globals.d.ts
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,backend/test/**,frontend/test/**,frontend/src/main.tsx,backend/src/server.ts
